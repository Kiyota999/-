<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務日報アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-sm">

<div class="max-w-md mx-auto bg-white min-h-screen p-3">

  <!-- ヘッダー -->
  <div class="flex justify-between items-center mb-2">
    <button id="prevMonth" class="px-3 py-2 bg-gray-200 rounded">←</button>
    <h2 id="monthLabel" class="font-bold text-lg"></h2>
    <button id="nextMonth" class="px-3 py-2 bg-gray-200 rounded">→</button>
  </div>

  <!-- カレンダー -->
  <div id="calendar" class="grid grid-cols-7 gap-1 text-center text-xs mb-4"></div>

  <h3 id="selectedDateLabel" class="font-semibold mb-2"></h3>
  <div id="taskList" class="space-y-2"></div>

  <!-- 操作 -->
  <div class="mt-4 space-y-2">
    <button id="exportCSV" class="w-full bg-green-500 text-white py-2 rounded">
      CSVエクスポート
    </button>
    <button id="openManage" class="w-full bg-blue-500 text-white py-2 rounded">
      顧客管理
    </button>
  </div>

  <div id="message" class="mt-2 text-green-600 text-xs"></div>
</div>

<!-- 顧客管理 -->
<div id="manageModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-end">
  <div class="bg-white w-full p-4 rounded-t-lg">
    <h3 class="font-bold mb-2">顧客管理</h3>
    <div id="customerList"></div>
    <input id="newCustomer" class="border p-2 w-full mt-2" placeholder="顧客名">
    <button id="addCustomer" class="mt-2 bg-blue-500 text-white w-full py-2 rounded">追加</button>
    <button id="closeManage" class="mt-2 bg-gray-300 w-full py-2 rounded">閉じる</button>
  </div>
</div>

<!-- メモ -->
<div id="memoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-end">
  <div class="bg-white w-full p-4 rounded-t-lg">
    <h3 class="font-bold mb-2">備考</h3>
    <textarea id="memoInput" class="w-full border p-2 h-32"></textarea>
    <button id="saveMemo" class="w-full bg-blue-500 text-white py-2 mt-2 rounded">保存</button>
    <button id="closeMemo" class="w-full bg-gray-300 py-2 mt-2 rounded">閉じる</button>
  </div>
</div>

<script>
const STORAGE_KEY = "dailyReportApp";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  customers: ["関西顧客（電話対応）"],
  records: {}
};

let currentDate = new Date();
let selectedDate = formatDate(new Date());
let currentMemoCustomer = null;

function formatDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function renderCalendar(){
  const el = document.getElementById("calendar");
  el.innerHTML="";

  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  document.getElementById("monthLabel").textContent = `${y}/${m+1}`;

  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++) el.appendChild(document.createElement("div"));

  for(let d=1; d<=last.getDate(); d++){
    const date = new Date(y,m,d);
    const key = formatDate(date);

    const total = Object.values(state.records[key]||{})
      .reduce((a,b)=>a+(b.time||0),0);

    const cell = document.createElement("div");
    cell.className = "p-1 rounded " + (key===selectedDate?"bg-blue-200":"");
    cell.innerHTML = `<div>${d}</div><div class="text-[10px] text-blue-500">${total?total+"h":""}</div>`;
    cell.onclick=()=>{selectedDate=key; renderTasks();};

    el.appendChild(cell);
  }
}

function renderTasks(){
  const box = document.getElementById("taskList");
  box.innerHTML="";

  document.getElementById("selectedDateLabel").textContent = selectedDate;

  state.customers.forEach(name=>{
    const data = state.records[selectedDate]?.[name] || {time:0,memo:""};

    const memoColor = data.memo ? "bg-blue-500 text-white" : "bg-gray-300";

    const row = document.createElement("div");
    row.className="flex items-center gap-2";

    row.innerHTML=`
      <input type="checkbox" class="w-5 h-5" ${data.time?"checked":""}>
      <span class="flex-1">${name}</span>
      <input type="number" class="w-16 border p-1 text-center" value="${data.time}">
      <button class="px-2 py-1 rounded ${memoColor}">メモ</button>
    `;

    const chk=row.children[0];
    const inp=row.children[2];
    const btn=row.children[3];

    chk.onchange=()=>{ if(!chk.checked) inp.value=0; update(name,inp.value,data.memo); };
    inp.oninput=()=>{ chk.checked=inp.value>0; update(name,inp.value,data.memo); };

    btn.onclick=()=>{
      currentMemoCustomer=name;
      document.getElementById("memoInput").value=data.memo||"";
      document.getElementById("memoModal").classList.remove("hidden");
    };

    box.appendChild(row);
  });
}

function update(name,time,memo=""){
  if(!state.records[selectedDate]) state.records[selectedDate]={};
  state.records[selectedDate][name]={time:Number(time),memo};
  save(); renderCalendar();
}

function exportCSV(){
  let rows=[["日付","顧客","時間","メモ"]];
  for(const d in state.records){
    for(const c in state.records[d]){
      const r=state.records[d][c];
      if(r.time>0) rows.push([d,c,r.time,`"${r.memo||""}"`]);
    }
  }
  const csv=rows.map(r=>r.join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="業務日報.csv";
  a.click();

  document.getElementById("message").textContent="CSVをダウンロードしました";
}

// ⭐ イベント（すべて明示取得）
document.getElementById("prevMonth").onclick = ()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};

document.getElementById("nextMonth").onclick = ()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};

document.getElementById("exportCSV").onclick = exportCSV;

document.getElementById("openManage").onclick = ()=>{
  document.getElementById("manageModal").classList.remove("hidden");
  renderCustomers();
};

document.getElementById("closeManage").onclick = ()=>{
  document.getElementById("manageModal").classList.add("hidden");
};

document.getElementById("addCustomer").onclick = ()=>{
  const input=document.getElementById("newCustomer");
  if(input.value){
    state.customers.push(input.value);
    input.value="";
    save();
    renderTasks();
    renderCustomers();
  }
};

function renderCustomers(){
  const list=document.getElementById("customerList");
  list.innerHTML="";
  state.customers.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="flex justify-between mb-1";
    div.innerHTML=`<span>${c}</span><button class="text-red-500">削除</button>`;
    div.children[1].onclick=()=>{
      state.customers.splice(i,1);
      save();
      renderCustomers();
      renderTasks();
    };
    list.appendChild(div);
  });
}

document.getElementById("saveMemo").onclick = ()=>{
  const memo=document.getElementById("memoInput").value;
  const cur=state.records[selectedDate]?.[currentMemoCustomer]||{time:0};
  update(currentMemoCustomer,cur.time,memo);
  document.getElementById("memoModal").classList.add("hidden");
  renderTasks();
};

document.getElementById("closeMemo").onclick = ()=>{
  document.getElementById("memoModal").classList.add("hidden");
};

// 初期
renderCalendar();
renderTasks();
</script>

</body>
</html>
