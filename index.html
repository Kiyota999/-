<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>業務日報アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-4xl mx-auto bg-white shadow rounded p-4">

  <!-- カレンダー -->
  <div class="flex justify-between items-center mb-4">
    <button id="prevMonth" class="px-3 py-1 bg-gray-200 rounded">← 前月</button>
    <h2 id="monthLabel" class="text-xl font-bold"></h2>
    <button id="nextMonth" class="px-3 py-1 bg-gray-200 rounded">翌月 →</button>
  </div>

  <div id="calendar" class="grid grid-cols-7 gap-2 mb-6"></div>

  <!-- 業務入力 -->
  <div>
    <h3 id="selectedDateLabel" class="text-lg font-semibold mb-2"></h3>
    <div id="taskList"></div>
  </div>

  <!-- 下部 -->
  <div class="mt-6 flex justify-between items-center">
    <button id="exportCSV" class="bg-green-500 text-white px-3 py-1 rounded">
      CSVエクスポート
    </button>
    <button id="openManage" class="text-blue-500 underline">
      データ管理
    </button>
  </div>

  <div id="message" class="mt-2 text-sm text-green-600"></div>

</div>

<!-- 顧客管理 -->
<div id="manageModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-4 rounded w-96">
    <h3 class="text-lg font-bold mb-2">顧客管理</h3>
    <div id="customerList"></div>
    <input id="newCustomer" class="border p-1 w-full mt-2" placeholder="顧客名">
    <button id="addCustomer" class="mt-2 bg-blue-500 text-white px-2 py-1 rounded">追加</button>
    <div class="text-right mt-3">
      <button id="closeManage" class="px-3 py-1 bg-gray-300 rounded">閉じる</button>
    </div>
  </div>
</div>

<!-- ⭐ メモモーダル -->
<div id="memoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-4 rounded w-96">
    <h3 class="text-lg font-bold mb-2">備考入力</h3>
    <textarea id="memoInput" class="border w-full p-2 h-32"></textarea>
    <div class="text-right mt-3">
      <button id="saveMemo" class="bg-blue-500 text-white px-3 py-1 rounded">保存</button>
      <button id="closeMemo" class="px-3 py-1 bg-gray-300 rounded ml-2">閉じる</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "dailyReportApp";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  customers: ["関西顧客（電話対応）"],
  records: {}
};

let currentDate = new Date();
let selectedDate = formatDate(new Date());
let currentMemoCustomer = null;

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("monthLabel").textContent =
    `${year}年 ${month+1}月`;

  const firstDay = new Date(year,month,1);
  const lastDay = new Date(year,month+1,0);

  for(let i=0;i<firstDay.getDay();i++){
    calendar.appendChild(document.createElement("div"));
  }

  for(let d=1; d<=lastDay.getDate(); d++){
    const date = new Date(year,month,d);
    const key = formatDate(date);

    const total = Object.values(state.records[key] || {})
      .reduce((a,b)=>a+(b.time||0),0);

    const cell = document.createElement("div");
    cell.className = "border p-2 cursor-pointer hover:bg-blue-100";
    cell.innerHTML = `
      <div>${d}</div>
      <div class="text-xs text-blue-500">${total?total+"h":""}</div>
    `;
    cell.onclick = ()=>{
      selectedDate = key;
      renderTasks();
    };

    calendar.appendChild(cell);
  }
}

function renderTasks() {
  const container = document.getElementById("taskList");
  const label = document.getElementById("selectedDateLabel");

  const date = new Date(selectedDate);
  const week = ["日","月","火","水","木","金","土"][date.getDay()];
  label.textContent = `${selectedDate} (${week})`;

  container.innerHTML = "";

  state.customers.forEach(name=>{
    const data = state.records[selectedDate]?.[name] || {time:0,memo:""};

    const row = document.createElement("div");
    row.className = "flex items-center gap-2 mb-1";

    const memoColor = data.memo ? "bg-blue-500 text-white" : "bg-gray-300";

    row.innerHTML = `
      <input type="checkbox" ${data.time?"checked":""}>
      <span class="flex-1">${name}</span>
      <input type="number" min="0" value="${data.time}" class="border w-20 p-1">
      <button class="px-2 py-1 rounded ${memoColor}">メモ</button>
    `;

    const checkbox = row.children[0];
    const input = row.children[2];
    const memoBtn = row.children[3];

    checkbox.onchange = ()=>{
      if(!checkbox.checked) input.value = 0;
      updateRecord(name, input.value, data.memo);
    };

    input.oninput = ()=>{
      checkbox.checked = input.value > 0;
      updateRecord(name, input.value, data.memo);
    };

    memoBtn.onclick = ()=>{
      currentMemoCustomer = name;
      document.getElementById("memoInput").value = data.memo || "";
      document.getElementById("memoModal").classList.remove("hidden");
    };

    container.appendChild(row);
  });
}

function updateRecord(name, time, memo="") {
  if(!state.records[selectedDate]){
    state.records[selectedDate] = {};
  }
  state.records[selectedDate][name] = {
    time: Number(time),
    memo: memo
  };
  save();
  renderCalendar();
}

function exportCSV() {
  let rows = [["日付","顧客名","時間","メモ"]];

  for(const date in state.records){
    for(const customer in state.records[date]){
      const d = state.records[date][customer];
      if(d.time > 0){
        rows.push([date, customer, d.time, `"${d.memo||""}"`]);
      }
    }
  }

  const csv = rows.map(r=>r.join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "業務日報.csv";
  a.click();

  URL.revokeObjectURL(url);

  document.getElementById("message").textContent =
    "CSVをダウンロードしました";
}

// メモ操作
document.getElementById("saveMemo").onclick = ()=>{
  const memo = document.getElementById("memoInput").value;

  const current = state.records[selectedDate]?.[currentMemoCustomer] || {time:0};

  updateRecord(currentMemoCustomer, current.time, memo);

  document.getElementById("memoModal").classList.add("hidden");
  renderTasks();
};

document.getElementById("closeMemo").onclick = ()=>{
  document.getElementById("memoModal").classList.add("hidden");
};

// その他イベント（省略せず全部）
document.getElementById("prevMonth").onclick = ()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};
document.getElementById("nextMonth").onclick = ()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};
document.getElementById("exportCSV").onclick = exportCSV;

document.getElementById("openManage").onclick = ()=>{
  document.getElementById("manageModal").classList.remove("hidden");
};
document.getElementById("closeManage").onclick = ()=>{
  document.getElementById("manageModal").classList.add("hidden");
};
document.getElementById("addCustomer").onclick = ()=>{
  const input = document.getElementById("newCustomer");
  if(input.value){
    state.customers.push(input.value);
    input.value="";
    save();
    renderTasks();
  }
};

// 初期描画
renderCalendar();
renderTasks();
</script>

</body>
</html>
